<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="饮记" />
  <meta name="theme-color" content="#88c1a3" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <script>
    // 首帧前确定主题，避免深色用户闪一下亮色；app.js 里的 applyTheme 负责后续切换
    (function () {
      try {
        var t = localStorage.getItem('coffee-theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#161a16');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
  <title>饮记</title>
</head>
<body>
  <div id="app"></div>

  <!-- 应用脚本 -->
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          // 页面加载时是否已被旧 SW 控制：没有则本次是首次安装，之后的接管不算"更新"
          const hadController = !!navigator.serviceWorker.controller;
          const reg = await navigator.serviceWorker.register('sw.js');
          // 每次打开主动查一次更新
          reg.update();
          // 新版本装好后自动切换并刷新一次（数据不受影响）
          reg.addEventListener('updatefound', () => {
            const sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', () => {
              if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                sw.postMessage('skip-waiting');
              }
            });
          });
          let refreshed = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!hadController) return; // 首次安装的接管不算更新，也不必刷新
            if (refreshed) return;
            refreshed = true;
            // reload 会丢掉页面状态，靠 sessionStorage 把"更新过"这件事带进新页面
            try { sessionStorage.setItem('coffee-updated', '1'); } catch (e) {}
            location.reload();
          });
        } catch (e) {}
      });
    }
  </script>
</body>
</html>
