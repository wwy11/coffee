<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="饮记" />
  <meta name="theme-color" content="#88c1a3" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <script>
    // 首帧前确定主题，避免深色用户闪一下亮色；app.js 里的 applyTheme 负责后续切换
    (function () {
      try {
        var t = localStorage.getItem('coffee-theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#161a16');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
  <title>饮记</title>
</head>
<body>
  <div id="app"></div>

  <!-- 应用脚本 -->
  <script src="app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          // 页面加载时是否已被旧 SW 控制：没有则本次是首次安装，之后的接管不算"更新"
          const hadController = !!navigator.serviceWorker.controller;
          // updateViaCache='none'：注册和 update() 时都强制网络请求 sw.js，不走 HTTP 缓存。
          // 没有这个的话，浏览器可能把 sw.js 本身也缓存一段时间，于是永远发现不了新版本。
          const reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
          // 每次打开主动查一次更新
          reg.update();
          // 新版本装好后自动切换并刷新一次（数据不受影响）
          reg.addEventListener('updatefound', () => {
            const sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', () => {
              if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                sw.postMessage('skip-waiting');
              }
            });
          });
          let refreshed = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!hadController) return; // 首次安装的接管不算更新，也不必刷新
            if (refreshed) return;
            refreshed = true;
            // reload 会丢掉页面状态，靠 sessionStorage 把"更新过"这件事带进新页面
            try { sessionStorage.setItem('coffee-updated', '1'); } catch (e) {}
            location.reload();
          });

          // 版本对账自愈：如果 SW 被卡在旧版本（例如之前 network-first 策略下，手机弱网导致
          // 新 sw.js 永远拉不下来），走正常 update() 流程救不回来，这里强踢一次。
          // 做法：问当前 SW 自己是什么版本（get-version），同时绕过所有缓存从网络拿一份 sw.js
          // 源码解出里面的 CACHE 常量，两者不一致就注销 SW + 清所有 caches + 重载。
          setTimeout(async () => {
            if (!navigator.serviceWorker.controller) return; // 首次安装，无需对账
            try {
              // 1) 问当前 SW 自报版本
              const curVer = await new Promise((resolve) => {
                const ch = new MessageChannel();
                const timer = setTimeout(() => resolve(null), 2000);
                ch.port1.onmessage = (e) => { clearTimeout(timer); resolve(e.data); };
                navigator.serviceWorker.controller.postMessage('get-version', [ch.port2]);
              });
              if (!curVer) return; // 老版本 SW 不懂这条消息，不碰
              // 2) 绕 cache 拿网络上最新的 sw.js，正则抠出里面的 CACHE 字面量
              const res = await fetch('sw.js?bust=' + Date.now(), { cache: 'no-store' });
              if (!res.ok) return;
              const text = await res.text();
              const m = text.match(/CACHE\s*=\s*['"]([^'"]+)['"]/);
              if (!m) return;
              const latestVer = m[1];
              if (latestVer === curVer) return; // 一致，不折腾
              // 3) 版本不一致——当前 SW 装不进新版本。清掉所有注册 + 所有 caches，刷一次就是全新
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map((r) => r.unregister()));
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
              location.reload();
            } catch (e) {}
          }, 1500);
        } catch (e) {}
      });
    }
  </script>
</body>
</html>
